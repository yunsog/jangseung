name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: build linux amd64 / arm64 (static)
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" -o jangseung-linux-$arch .
          done
          sha256sum jangseung-linux-* > SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" jangseung-linux-amd64 jangseung-linux-arm64 SHA256SUMS \
            --title "Jangseung ${GITHUB_REF_NAME#v}" --notes-file <(sed -n '/^## \['"${GITHUB_REF_NAME#v}"'\]/,/^## \[/p' CHANGELOG.md | sed '$d')
