name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: static build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o jangseung .
      - name: version / config check
        run: |
          ./jangseung -version
          ./jangseung -check -c deploy/jangseung.conf.example
